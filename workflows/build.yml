name: NOVA-PI P2 Firmware Build

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4
  - name: Show project files
    run: |
      pwd
      ls -la
      find . -maxdepth 3 -name platformio.ini -print
  - name: Install Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"
  - name: Install PlatformIO
    run: pip install platformio
  - name: Compile ESP32-S3 firmware
    run: pio run -d .
  - name: Upload firmware
    uses: actions/upload-artifact@v4
    with:
      name: NOVA-PI-P2-firmware
      path: .pio/build/esp32-s3-devkitc-1/firmware.bin
      if-no-files-found: error